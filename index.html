<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rats — Policies</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#15202b;--muted:#5b6672;--brand:#001E4F;--accent:#2563EB;--border:#e4e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#0c1420;--card:#111c2b;--ink:#e7edf5;--muted:#9fb0c3;--brand:#8fb2ff;--accent:#6ea0ff;--border:#22344a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
header a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-top:16px}
h1{color:var(--brand);font-size:28px;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:20px;margin:1.6em 0 .5em;border-top:1px solid var(--border);padding-top:1.1em}
h3{font-size:16px;margin:1.3em 0 .3em}
h2:first-of-type{border-top:none;padding-top:0}
a{color:var(--accent)}
code{background:rgba(127,127,127,.14);padding:.1em .35em;border-radius:5px;font-size:.9em}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;font-size:14px}
th{background:rgba(127,127,127,.08)}
strong{color:var(--ink)}
.muted{color:var(--muted);font-size:14px}
hr{border:none;border-top:1px solid var(--border);margin:2em 0}
footer{margin-top:26px;color:var(--muted);font-size:13px;text-align:center}
footer a{margin:0 8px}
</style>
</head><body><div class="wrap">

<div class="card">

</ul>
</div>
<footer>

</div></body></html>
